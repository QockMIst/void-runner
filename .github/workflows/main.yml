name: RUNNER

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: void-scanner-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clone the PRIVATE code repo
        env:
          PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -z "$PAT" ]; then echo "PRIVATE_REPO_PAT IS EMPTY"; exit 1; fi
          git clone "https://x-access-token:${PAT}@github.com/QockMIst/derr.git" app

      - name: Install Python & OCR packages
        working-directory: app
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt

      - name: Run Discord bot + cloud scanner
        working-directory: app
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SCANNER_TOKEN: ${{ secrets.DISCORD_SCANNER_TOKEN }}
          VOID_SCANNER_TOKEN: ${{ secrets.VOID_SCANNER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VALUE_REQUESTS_CHANNEL_ID: ${{ secrets.VALUE_REQUESTS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_TURSO: '1'
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python3 -u cloud_scan_batch.py 2>&1 | tee run.log

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main || true
